name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Validate HTML
      uses: Cyb3r-Jak3/html5validator-action@v7.2.0
      with:
        root: ./
        
    - name: 🎨 Lint CSS
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    - run: |
        npm install -g stylelint stylelint-config-standard
        stylelint "*.css" || echo "CSS linting completed with warnings"
        
    - name: 📝 Check JavaScript
      run: |
        # Basic JavaScript syntax check
        node -c script.js
        node -c payscript.js
        echo "✅ JavaScript syntax check passed"
        
    - name: 🔐 Security Check
      run: |
        # Check for common security issues
        if grep -r "YOUR_SMS_API_KEY" . --exclude-dir=.git; then
          echo "⚠️  Warning: Found placeholder API keys that should be replaced"
        fi
        if grep -r "password" . --exclude-dir=.git --exclude="*.md"; then
          echo "⚠️  Warning: Found potential hardcoded passwords"
        fi
        echo "🔐 Security check completed"

  deployment-ready:
    name: 🚀 Deployment Readiness
    runs-on: ubuntu-latest
    needs: quality-check
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🌐 Test Web Server
      run: |
        # Start a simple HTTP server to test if files are accessible
        python3 -m http.server 8000 &
        sleep 5
        
        # Test if main files are accessible
        curl -f http://localhost:8000/ > /dev/null && echo "✅ index.html accessible"
        curl -f http://localhost:8000/pay.html > /dev/null && echo "✅ pay.html accessible"
        curl -f http://localhost:8000/script.js > /dev/null && echo "✅ script.js accessible"
        curl -f http://localhost:8000/styles.css > /dev/null && echo "✅ styles.css accessible"
        
        echo "🚀 All files are accessible via web server"
        
    - name: 📊 Generate Report
      run: |
        echo "## 📊 Build Report" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ All files accessible via web server" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 Project is deployment ready" >> $GITHUB_STEP_SUMMARY